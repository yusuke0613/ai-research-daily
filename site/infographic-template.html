<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>infographic</title>
<style>
  :root {
    --bg-from: #1e1b4b; --bg-to: #312e81;
    --accent: #818cf8; --accent-soft: rgba(129, 140, 248, 0.18);
    --text: #f5f5f7; --text-dim: rgba(245, 245, 247, 0.72);
    --card: rgba(255, 255, 255, 0.07); --card-border: rgba(255, 255, 255, 0.14);
  }
  [data-theme="teal"] {
    --bg-from: #042f2e; --bg-to: #134e4a;
    --accent: #2dd4bf; --accent-soft: rgba(45, 212, 191, 0.16);
  }
  [data-theme="sunset"] {
    --bg-from: #431407; --bg-to: #7c2d12;
    --accent: #fb923c; --accent-soft: rgba(251, 146, 60, 0.16);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; }
  body {
    font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", sans-serif;
    background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%);
    color: var(--text);
    display: flex; flex-direction: column;
    padding: 64px 72px;
  }
  .brand-row { display: flex; justify-content: space-between; align-items: baseline; }
  .brand { font-size: 30px; font-weight: 700; letter-spacing: 0.14em; color: var(--accent); text-transform: uppercase; }
  .date { font-size: 34px; font-weight: 600; color: var(--text-dim); font-variant-numeric: tabular-nums; }
  .title {
    margin-top: 46px;
    font-size: 66px; font-weight: 800; line-height: 1.25;
    letter-spacing: 0.01em;
  }
  .title::after {
    content: ""; display: block; width: 120px; height: 8px;
    margin-top: 26px; border-radius: 4px; background: var(--accent);
  }
  .cards { margin-top: 52px; display: flex; flex-direction: column; gap: 28px; flex: 1; }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 34px 38px;
    display: flex; gap: 30px; align-items: flex-start;
  }
  .num {
    flex: 0 0 auto;
    width: 64px; height: 64px; border-radius: 18px;
    background: var(--accent-soft); color: var(--accent);
    font-size: 34px; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
  }
  .card-body { min-width: 0; }
  .headline { font-size: 40px; font-weight: 700; line-height: 1.3; }
  .oneliner { margin-top: 12px; font-size: 28px; line-height: 1.5; color: var(--text-dim); }
  .basic {
    margin-top: 20px;
    border-radius: 24px;
    background: var(--accent-soft);
    border: 1px solid var(--card-border);
    padding: 34px 38px;
  }
  .basic-label { font-size: 24px; font-weight: 700; letter-spacing: 0.18em; color: var(--accent); }
  .basic-title { margin-top: 14px; font-size: 38px; font-weight: 700; line-height: 1.3; }
  .basic-point { margin-top: 12px; font-size: 27px; line-height: 1.55; color: var(--text-dim); }
  .footer { margin-top: 36px; display: flex; justify-content: space-between; font-size: 22px; color: var(--text-dim); }
</style>
</head>
<body>
  <div class="brand-row">
    <div class="brand">AI Research Daily</div>
    <div class="date" id="date"></div>
  </div>
  <h1 class="title" id="title"></h1>
  <div class="cards" id="cards"></div>
  <div class="basic">
    <div class="basic-label">今日の基礎</div>
    <div class="basic-title" id="basic-title"></div>
    <div class="basic-point" id="basic-point"></div>
  </div>
  <div class="footer">
    <span>毎朝6時 自動生成</span>
    <span>Claude Code Routine × GitHub Actions</span>
  </div>
<script>
  const data = /*__DATA__*/ null;
  if (data) {
    if (data.theme) document.documentElement.setAttribute("data-theme", data.theme);
    document.getElementById("date").textContent = data.date;
    document.getElementById("title").textContent = data.title;
    const cards = document.getElementById("cards");
    for (const [i, item] of (data.top3 || []).entries()) {
      const card = document.createElement("div");
      card.className = "card";
      const num = document.createElement("div");
      num.className = "num";
      num.textContent = String(i + 1);
      const body = document.createElement("div");
      body.className = "card-body";
      const h = document.createElement("div");
      h.className = "headline";
      h.textContent = item.headline;
      const o = document.createElement("div");
      o.className = "oneliner";
      o.textContent = item.oneliner;
      body.append(h, o);
      card.append(num, body);
      cards.append(card);
    }
    document.getElementById("basic-title").textContent = data.basicTopic?.title || "";
    document.getElementById("basic-point").textContent = data.basicTopic?.keyPoint || "";
  }
</script>
</body>
</html>

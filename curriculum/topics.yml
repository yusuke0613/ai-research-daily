# 基礎学習カリキュラム
# 毎朝の日次ブリーフ「今日の基礎」で1日1トピックを順番に消化する。
# 進捗は data/state/curriculum-progress.json の nextIndex で管理(0始まりの通し番号)。
# 一巡したら各トピックの深掘り版(実装演習・落とし穴集)に差し替えて二周目に入る。

tracks:
  - name: "LLM基礎"
    topics:
      - id: llm-01
        title: "LLMは何をしているのか: 次トークン予測という仕組み"
        goal: "『賢い検索』ではなく『続きを予測する装置』だと説明できる"
      - id: llm-02
        title: "トークンとは何か: 料金・速度・制限のすべての単位"
        goal: "日本語1文字≒1〜2トークンの感覚と、料金計算の方法を身につける"
      - id: llm-03
        title: "コンテキストウィンドウ: モデルの『作業机の広さ』"
        goal: "長い入力で精度が落ちる理由(lost in the middle)を説明できる"
      - id: llm-04
        title: "システムプロンプトとユーザープロンプトの役割分担"
        goal: "アプリ開発時にどちらへ何を書くべきか判断できる"
      - id: llm-05
        title: "temperatureとサンプリング: 出力のばらつきの正体"
        goal: "業務自動化でtemperatureをどう設定すべきか判断できる"
      - id: llm-06
        title: "ハルシネーションはなぜ起きるのか"
        goal: "仕組み上避けられない理由と、実務での抑制策3つを言える"
      - id: llm-07
        title: "事前学習・ファインチューニング・RLHFの違い"
        goal: "『自社データで学習させたい』への正しい返答ができる"
      - id: llm-08
        title: "ファインチューニング vs RAG vs プロンプト: 使い分けの判断基準"
        goal: "コスト・鮮度・難易度の3軸で選択できる"
      - id: llm-09
        title: "埋め込み(Embedding): 意味を数値ベクトルにする技術"
        goal: "類似検索がなぜできるのかを図で説明できる"
      - id: llm-10
        title: "推論モデル(o系/thinking系)は何が違うのか"
        goal: "通常モデルとの使い分けとコスト感を説明できる"
      - id: llm-11
        title: "マルチモーダル: 画像・音声・PDFをLLMはどう見ているか"
        goal: "画像入力の得意・不得意を実務目線で判断できる"
      - id: llm-12
        title: "モデルの選び方: 大中小モデルとコストのトレードオフ"
        goal: "タスクごとに適切なモデルサイズを選定できる"
      - id: llm-13
        title: "プロンプトエンジニアリングの本質: 指示・文脈・例示・出力形式"
        goal: "闇雲な試行錯誤ではなく構造で改善できる"
      - id: llm-14
        title: "構造化出力(JSONモード)とツール呼び出しの基礎"
        goal: "LLMの出力をプログラムに安全に渡す方法を知る"
      - id: llm-15
        title: "LLM評価入門: どうやって『良くなった』を測るのか"
        goal: "LLM-as-a-judgeと人手評価の使いどころを知る"

  - name: "RAG基礎"
    topics:
      - id: rag-01
        title: "RAGとは何か: 『検索して渡すだけ』をなぜ皆やるのか"
        goal: "RAGの全体フロー(検索→注入→生成)を1枚の図で描ける"
      - id: rag-02
        title: "チャンク分割: 文書をどう切るかが精度の半分を決める"
        goal: "固定長・意味単位・階層チャンクの使い分けを知る"
      - id: rag-03
        title: "ベクトル検索とキーワード検索(BM25)のハイブリッド"
        goal: "それぞれが得意な質問タイプを説明できる"
      - id: rag-04
        title: "ベクトルDB入門: 何を保存し、何で選ぶのか"
        goal: "pgvector/Pinecone/Chroma等の選定観点を持つ"
      - id: rag-05
        title: "リランキング: 検索結果を並べ直すだけで精度が上がる理由"
        goal: "2段階検索(retrieve→rerank)の構成を説明できる"
      - id: rag-06
        title: "クエリ変換: ユーザーの質問をそのまま検索してはいけない"
        goal: "HyDE・クエリ拡張・分解の考え方を知る"
      - id: rag-07
        title: "RAGの評価: 検索精度と回答精度を分けて測る"
        goal: "『答えが悪い』の原因を検索側/生成側に切り分けられる"
      - id: rag-08
        title: "メタデータフィルタと権限管理: 社内RAGの必須要件"
        goal: "部署別アクセス制御をRAGにどう組み込むか説明できる"
      - id: rag-09
        title: "RAGが失敗する典型パターン7選"
        goal: "PoCで陥りがちな罠を事前に列挙できる"
      - id: rag-10
        title: "GraphRAG・階層RAG: 単純な類似検索を超える手法"
        goal: "『横断的な質問』に通常RAGが弱い理由と対策を知る"
      - id: rag-11
        title: "ロングコンテキスト時代にRAGは不要になるのか"
        goal: "全文投入とRAGのコスト・精度比較で判断できる"
      - id: rag-12
        title: "Agentic RAG: エージェントが自分で検索を繰り返す構成"
        goal: "固定パイプラインとの違いと向く場面を説明できる"
      - id: rag-13
        title: "社内文書RAGの現実: 前処理(パース・OCR・表)が8割"
        goal: "PDFや Excel の取り込みで何が問題になるか知る"
      - id: rag-14
        title: "RAGシステムの運用: インデックス更新と鮮度管理"
        goal: "文書更新をどう反映し続けるかの設計を描ける"
      - id: rag-15
        title: "RAG導入の進め方: PoCから本番までのロードマップ"
        goal: "社内提案に使える段階的導入計画を書ける"

  - name: "AIエージェント基礎"
    topics:
      - id: agent-01
        title: "AIエージェントとは何か: チャットボットとの決定的な違い"
        goal: "『ループの中でツールを使い自律行動する』と説明できる"
      - id: agent-02
        title: "ツール使用(Function Calling): エージェントの手足"
        goal: "ツール定義→呼び出し→結果返却のサイクルを説明できる"
      - id: agent-03
        title: "ReActパターン: 考えて、動いて、観察するループ"
        goal: "エージェントの基本ループを擬似コードで書ける"
      - id: agent-04
        title: "計画と実行の分離: Plan-and-Executeパターン"
        goal: "複雑タスクでなぜ事前計画が効くのかを説明できる"
      - id: agent-05
        title: "エージェントのメモリ: 短期記憶と長期記憶の設計"
        goal: "会話履歴・スクラッチパッド・永続メモリを区別できる"
      - id: agent-06
        title: "MCP(Model Context Protocol): ツール接続の標準規格"
        goal: "MCPが解決する問題と基本構成(ホスト/サーバー)を説明できる"
      - id: agent-07
        title: "マルチエージェント: 分業させると何が良くて何が難しいか"
        goal: "オーケストレーター型とスウォーム型の違いを知る"
      - id: agent-08
        title: "エージェントの信頼性: なぜ本番投入が難しいのか"
        goal: "エラー複利(90%×90%×…)の問題と対策を説明できる"
      - id: agent-09
        title: "ガードレールと人間の承認(Human-in-the-loop)設計"
        goal: "どの操作に承認を挟むべきかの判断基準を持つ"
      - id: agent-10
        title: "エージェントの評価とトレーシング"
        goal: "多段動作をどう観測・デバッグするかの道具立てを知る"
      - id: agent-11
        title: "プロンプトインジェクション: エージェント時代の最重要脅威"
        goal: "外部データ経由の攻撃例と多層防御を説明できる"
      - id: agent-12
        title: "ワークフロー vs エージェント: 自律性はいつ必要か"
        goal: "『固定パイプラインで十分』な場面を見抜ける"
      - id: agent-13
        title: "コンテキストエンジニアリング: エージェント設計の中核スキル"
        goal: "何を文脈に入れ、何を外すかの設計原則を知る"
      - id: agent-14
        title: "サブエージェントと並列化: 大きな仕事の分割統治"
        goal: "調査タスクを並列サブエージェントに割る設計ができる"
      - id: agent-15
        title: "社内業務へのエージェント導入: 向く業務・向かない業務"
        goal: "自社業務からエージェント適用候補を3つ挙げられる"

  - name: "コーディングエージェント(Claude Code / Codex)"
    topics:
      - id: code-01
        title: "コーディングエージェントとは: 補完(Copilot)との違い"
        goal: "補完・チャット・自律エージェントの3世代を説明できる"
      - id: code-02
        title: "Claude Codeの仕組み: ツールループとファイル操作"
        goal: "Read/Edit/Bash等のツールで動く仕組みを説明できる"
      - id: code-03
        title: "CLAUDE.md とプロジェクト設定: エージェントへの『社内ルール』"
        goal: "自プロジェクトに置くべきCLAUDE.mdを書ける"
      - id: code-04
        title: "OpenAI Codex: 構成とClaude Codeとの思想の違い"
        goal: "クラウド実行型とローカルCLI型の違いを説明できる"
      - id: code-05
        title: "権限モデルとサンドボックス: 何を許可すべきか"
        goal: "安全に自動実行させる権限設計の考え方を知る"
      - id: code-06
        title: "ヘッドレス実行とCI連携: 人が見ていない所で動かす"
        goal: "claude -p やGitHub Actions連携の構成を説明できる"
      - id: code-07
        title: "スラッシュコマンドとスキル: 定型作業の部品化"
        goal: "チームの定型作業をスキル化する候補を挙げられる"
      - id: code-08
        title: "MCPサーバーをコーディングエージェントに繋ぐ"
        goal: "社内API・DBをエージェントから安全に触らせる構成を知る"
      - id: code-09
        title: "プランモードと段階的実行: 大きな変更の進め方"
        goal: "計画→承認→実装のフローがなぜ事故を減らすか説明できる"
      - id: code-10
        title: "テスト駆動でエージェントを使う: 検証可能性が生命線"
        goal: "『テストがあるほどエージェントは強い』理由を説明できる"
      - id: code-11
        title: "コードレビューへのAI活用: 人のレビューとの役割分担"
        goal: "AIレビューを開発フローのどこに挟むか設計できる"
      - id: code-12
        title: "レガシーコード・大規模リポジトリでの使い方"
        goal: "コンテキストに収まらないコードベースの攻略法を知る"
      - id: code-13
        title: "定期実行エージェント(Routine/cron)による自動化"
        goal: "本パイプラインの構成を人に説明できる"
      - id: code-14
        title: "チーム導入の実際: ライセンス・セキュリティ・ガイドライン"
        goal: "社内導入提案書に必要な論点を列挙できる"
      - id: code-15
        title: "コーディングエージェント時代の開発者スキル"
        goal: "設計・レビュー・検証力へ重心が移る理由を説明できる"
